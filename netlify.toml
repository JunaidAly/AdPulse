[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # tailwindcss-animate declares a broad peer range that trips npm's strict
  # resolver; install the same way we do locally.
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_VERSION = "20"

# SPA fallback: let React Router handle client-side routes so deep links and
# refreshes (e.g. /dashboard, /login) don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
